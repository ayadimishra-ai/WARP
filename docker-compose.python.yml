version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snowkap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  hasura:
    image: hasura/graphql-engine:v2.36.0
    depends_on: [postgres]
    ports:
      - "8080:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgres@postgres:5432/snowkap
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: localadminsecret
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"changeme_jwt_secret_at_least_32_chars"}'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on: [postgres]
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  streamlit-ghg:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./frontend/streamlit:/app
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000/api/v1
    command: >
      bash -c "pip install -r requirements.txt -q &&
               streamlit run ghg/dashboard.py --server.port=8501 --server.address=0.0.0.0"

  streamlit-esg:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./frontend/streamlit:/app
    ports:
      - "8502:8502"
    environment:
      API_BASE_URL: http://backend:8000/api/v1
    command: >
      bash -c "pip install -r requirements.txt -q &&
               streamlit run esg/score_dashboard.py --server.port=8502 --server.address=0.0.0.0"

  streamlit-ops:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./frontend/streamlit:/app
    ports:
      - "8503:8503"
    environment:
      API_BASE_URL: http://backend:8000/api/v1
    command: >
      bash -c "pip install -r requirements.txt -q &&
               streamlit run ops/monthly_activity.py --server.port=8503 --server.address=0.0.0.0"

volumes:
  pgdata:
