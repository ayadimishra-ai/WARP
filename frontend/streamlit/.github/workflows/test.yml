name: GHG Calculator — CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed test database
        run: |
          cd ghg_calculator
          python setup.py --force
        env:
          PYTHONPATH: .

      - name: Run test suite
        run: |
          cd ghg_calculator
          python -m pytest tests/ \
            --tb=short \
            --no-header \
            -q \
            --ignore=tests/test_sprint24.py
        env:
          PYTHONPATH: .

      - name: Check page syntax
        run: |
          cd ghg_calculator
          python -c "
          import sys, ast
          from pathlib import Path
          pages = sorted(Path('streamlit_app').glob('_page*.py'))
          for p in pages:
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  print(f'SYNTAX ERROR in {p.name}: {e}')
                  sys.exit(1)
          print(f'All {len(pages)} pages: syntax OK')
          "

      - name: CEA v20 regression check
        run: |
          cd ghg_calculator
          python -c "
          import sys
          sys.path.insert(0, '.')
          from ef_store.db import setup_db
          from modules.purchased_electricity import PurchasedElectricity
          from modules.base import ActivityRecord
          conn = setup_db('data/ef_store.sqlite')
          r = PurchasedElectricity().calculate(ActivityRecord(
              scope='Scope 2',
              process='S2 \u2014 Purchased electricity (grid)',
              country='IN', quantity=70_000_000, unit='kWh',
              reporting_year=2024, fiscal_year='2023-24', gwp_ar=6,
          ), conn)
          conn.close()
          assert abs(r.t_CO2e - 50890.0) < 1.0, f'CEA regression FAIL: {r.t_CO2e}'
          print(f'CEA v20: {r.t_CO2e:.2f} tCO2e — OK')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install flake8
      - name: Lint (errors only)
        run: |
          cd ghg_calculator
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --max-line-length=120 \
            --exclude=__pycache__,data,ef_store/seeds \
            --statistics
