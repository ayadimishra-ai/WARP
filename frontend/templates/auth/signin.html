<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Snowkap ESG</title>
  <link rel="stylesheet" href="/static/css/base.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <img src="/static/img/logo.svg" alt="Snowkap" class="auth-logo" />
    <h1>Sign in</h1>

    {% if error %}
    <div class="alert alert--error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/api/v1/auth/signin" id="signin-form" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email"
             value="{{ email | default('') }}" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />

      <button type="submit" class="btn btn--primary">Sign in</button>
    </form>

    <a href="/forgot-password" class="auth-link">Forgot password?</a>
  </div>

  <script src="/static/js/auth.js"></script>
</body>
</html>
