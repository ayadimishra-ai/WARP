table:
  name: Question
  schema: public
object_relationships:
  - name: Section
    using:
      foreign_key_constraint_on: sectionId
array_relationships:
  - name: Answers
    using:
      foreign_key_constraint_on:
        column: questionId
        table:
          name: Answer
          schema: public
  - name: FormFields
    using:
      foreign_key_constraint_on:
        column: questionId
        table:
          name: FormField
          schema: public
  - name: FormResults
    using:
      foreign_key_constraint_on:
        column: questionId
        table:
          name: FormResult
          schema: public
computed_fields:
  - name: json_tags
    definition:
      function:
        name: fn_parse_question_tags_to_jsonb
        schema: public
insert_permissions:
  - role: Creator
    permission:
      check:
        Section:
          Form:
            CompanyForms:
              Company:
                platformId:
                  _eq: x-hasura-platform-id
      columns:
        - calc
        - content
        - id
        - key
        - parentQuestionId
        - sectionId
        - tags
        - weightage
select_permissions:
  - role: Analytics
    permission:
      columns:
        - tags
        - calc
        - weightage
        - content
        - key
        - created_at
        - updated_at
        - id
        - parentQuestionId
        - sectionId
      computed_fields:
        - json_tags
      filter:
        Section:
          Form:
            CompanyForms:
              Company:
                platformId:
                  _eq: x-hasura-platform-id
  - role: Approver
    permission:
      columns:
        - tags
        - calc
        - weightage
        - content
        - key
        - created_at
        - updated_at
        - id
        - parentQuestionId
        - sectionId
      computed_fields:
        - json_tags
      filter:
        Section:
          Form:
            CompanyForms:
              Company:
                _and:
                  - isActive:
                      _eq: true
                  - platformId:
                      _eq: x-hasura-platform-id
                  - parentCompanyId:
                      _eq: x-hasura-company-id
  - role: Creator
    permission:
      columns:
        - tags
        - calc
        - weightage
        - content
        - key
        - created_at
        - updated_at
        - id
        - parentQuestionId
        - sectionId
      computed_fields:
        - json_tags
      filter:
        Section:
          Form:
            CompanyForms:
              Company:
                platformId:
                  _eq: x-hasura-platform-id
  - role: Invitee
    permission:
      columns:
        - tags
        - calc
        - weightage
        - content
        - key
        - created_at
        - updated_at
        - id
        - parentQuestionId
        - sectionId
      computed_fields:
        - json_tags
      filter:
        Section:
          Form:
            CompanyForms:
              Company:
                _and:
                  - isActive:
                      _eq: true
                  - platformId:
                      _eq: x-hasura-platform-id
                  - id:
                      _eq: x-hasura-company-id
  - role: Inviter
    permission:
      columns:
        - tags
        - calc
        - weightage
        - content
        - key
        - created_at
        - updated_at
        - id
        - parentQuestionId
        - sectionId
      computed_fields:
        - json_tags
      filter:
        Section:
          Form:
            CompanyForms:
              Company:
                _and:
                  - isActive:
                      _eq: true
                  - platformId:
                      _eq: x-hasura-platform-id
                  - parentCompanyId:
                      _eq: x-hasura-company-id
  - role: Platform
    permission:
      columns:
        - tags
        - calc
        - weightage
        - content
        - key
        - created_at
        - updated_at
        - id
        - parentQuestionId
        - sectionId
      computed_fields:
        - json_tags
      filter:
        Section:
          Form:
            CompanyForms:
              Company:
                platformId:
                  _eq: x-hasura-platform-id
update_permissions:
  - role: Creator
    permission:
      columns:
        - calc
        - content
        - id
        - key
        - parentQuestionId
        - sectionId
        - tags
        - weightage
      filter:
        Section:
          Form:
            CompanyForms:
              Company:
                platformId:
                  _eq: x-hasura-platform-id
      check: null
