table:
  name: User
  schema: public
object_relationships:
  - name: Company
    using:
      foreign_key_constraint_on: companyId
array_relationships:
  - name: FormSubmissions
    using:
      foreign_key_constraint_on:
        column: submittedBy
        table:
          name: FormSubmission
          schema: public
  - name: FormSubmissionsApproved
    using:
      foreign_key_constraint_on:
        column: approvedBy
        table:
          name: FormSubmission
          schema: public
  - name: UserRoles
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: UserRole
          schema: public
select_permissions:
  - role: Analytics
    permission:
      columns:
        - isActive
        - details
        - email
        - image
        - name
        - phone
        - created_at
        - emailVerified
        - phoneVerified
        - updated_at
        - companyId
        - created_by
        - id
        - updated_by
      filter:
        id:
          _eq: X-Hasura-User-Id
  - role: Approver
    permission:
      columns:
        - isActive
        - details
        - email
        - image
        - name
        - phone
        - created_at
        - emailVerified
        - phoneVerified
        - updated_at
        - companyId
        - created_by
        - id
        - updated_by
      filter:
        _and:
          - isActive:
              _eq: true
          - id:
              _eq: x-hasura-user-id
  - role: Creator
    permission:
      columns:
        - isActive
        - details
        - email
        - image
