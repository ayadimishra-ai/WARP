event_triggers:
  - name: ManageUser_Delete
    definition:
      delete:
        columns: '*'
      enable_manual: false
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: https://alphams.snowkap.com/api/warp/webhook/user/manage
    headers:
      - name: Authorization
        value: EzqUt3IXQxidMdRA
      - name: Content-Type
        value: application/json
    request_transform:
      body:
        action: transform
        template: '{{$body.event}}'
      template_engine: Kriti
      version: 2
  - name: ManageUser_Insert
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
