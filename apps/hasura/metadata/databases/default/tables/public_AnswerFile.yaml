table:
  name: AnswerFile
  schema: public
object_relationships:
  - name: Answer
    using:
      foreign_key_constraint_on: answerId
insert_permissions:
  - role: Invitee
    permission:
      check:
        Answer:
          Question:
            Section:
              Form:
                CompanyForms:
                  Company:
                    platformId:
                      _eq: x-hasura-platform-id
      columns:
        - name
        - path
        - provider
        - sizeInBytes
        - type
        - created_at
        - answerId
        - id
