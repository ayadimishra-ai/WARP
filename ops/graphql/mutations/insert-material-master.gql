mutation insertMaterialMaster($objects: [OrgMaterialMaster_insert_input!]!) {
  insert_OrgMaterialMaster(objects: $objects) {
    returning {
      id
      name
      code
      type
      Material_Weight_Per_Unit
      UoM_Material_Weight
      Material_Classification
      Material_Description
      Additional_Information
      organization_id
      created_at
      updated_at
    }
  }
}
