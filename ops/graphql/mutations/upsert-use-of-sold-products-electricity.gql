mutation upsertUseOfSoldProductsElectricity(
  $where: GHGUseOfSoldProducts_Electricity_bool_exp!
  $electricityData: [GHGUseOfSoldProducts_Electricity_insert_input!]!
  $electricityUpdate: [GHGUseOfSoldProducts_Electricity_updates!]!
) {
  delete_GHGUseOfSoldProducts_Electricity(where: $where) {
    returning {
      id
      task_request_id
      activity_task_request_id
      organization_address_id
      Date
      Product_Code
      Lifetime_of_Product
      Rationale
      Region
      Units_of_Electricity_consumed_in_kWh
      Additional_comments
      Remarks
      metadata
    }
  }
  insert_GHGUseOfSoldProducts_Electricity(
    objects: $electricityData
    on_conflict: { constraint: GHGUseOfSoldProducts_Electricity_pkey }
  ) {
    returning {
      id
      task_request_id
      activity_task_request_id
      organization_address_id
      Date
      Product_Code
      Lifetime_of_Product
      Rationale
      Region
      Units_of_Electricity_consumed_in_kWh
      Additional_comments
      Remarks
      metadata
    }
  }
  update_GHGUseOfSoldProducts_Electricity_many(updates: $electricityUpdate) {
    returning {
      id
      task_request_id
      activity_task_request_id
      organization_address_id
      Date
      Product_Code
      Lifetime_of_Product
      Rationale
      Region
      Units_of_Electricity_consumed_in_kWh
      Additional_comments
      Remarks
      metadata
    }
  }
}
