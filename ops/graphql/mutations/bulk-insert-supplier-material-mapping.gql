mutation bulkInsertSupplierMaterialMapping($objects: [SupplierMaterialMapping_insert_input!]!) {
  insert_SupplierMaterialMapping(objects: $objects) {
    affected_rows
    returning {
      id
      supplier_address_mapping_id
      org_material_master_id
      From_Year
      From_Month
      To_Year
      To_Month
      meta_data
      created_at
    }
  }
}
