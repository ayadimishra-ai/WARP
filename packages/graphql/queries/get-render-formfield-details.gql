query getRenderFormFieldDetails($invitationId: uuid!) {
  FormInvitation(where: { _and: [{ id: { _eq: $invitationId } }] }) {
    Form {
      id
      name
      isDelegateQuestion
      isAIDataPointsAdded
      Details {
        focusArea
      }
      FormFields(order_by: { field: asc }) {
        id
        field
        type
        Section {
          id
          key
          content
          parentSectionId: sectionId
          ParentSection {
            id
            key
            content
          }
        }
        Question {
          id
          key
          parentQuestionId
        }
        questionId
        fieldOptions
        interface
        interfaceOptions
        display
        displayOptions
        displayRules
        validationRules
        seqIndex
        groupField
        recommendationCalc
        subtheme
        formId
        warningRules
        autoCalculatedCalculation
        InvitationComments_aggregate(
          where: { invitationId: { _eq: $invitationId } }
        ) {
          aggregate {
            count
          }
        }
      }
    }
    Suggestions {
      formFieldId
      id
      suggestion
      isSelected
      selectedByUserId
      SuggestionSourceMappings(order_by: { Source: { type: asc } }) {
        suggestionPageNo
        suggestionInfoContent
        Source {
          id
          type
          url
          SourceFile {
            id
            originalFileUrl
            originalFileName
            created_at
          }
        }
      }
    }
  }
}
