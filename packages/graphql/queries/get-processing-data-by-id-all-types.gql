query getProcessingDataByIdAllTypes($Id: [uuid!]!, $inputFields: [String!]!) {
  AIBulkDocumentProcessing(where: { id: { _in: $Id } }) {
    id
    formInvitationId
    processedDocuments
    requestStatus
    processingType: __typename
    FormInvitation {
      id
      metadata
      FormSubmissions(where: { isActive: { _eq: true } }) {
        Answers {
          formFieldId
          data
          FormField {
            id
            type
            field
            questionId
            fieldOptions
          }
        }
      }
      Form {
        FormFields(
          where: {
            questionId: { _is_null: false }
            type: { _in: $inputFields }
          }
        ) {
          id
          fieldOptions
          displayRules
          type
          questionId
          Question {
            key
          }
        }
        formtype
        id
      }
    }
  }
  WebCuration(where: { id: { _in: $Id } }) {
    id
    formInvitationId
    status
    processingType: __typename
    FormInvitation {
      id
      metadata
      FormSubmissions(where: { isActive: { _eq: true } }) {
        Answers {
          formFieldId
          data
          FormField {
            id
            type
            field
            questionId
            fieldOptions
          }
        }
      }
      Form {
        FormFields(
          where: {
            questionId: { _is_null: false }
            type: { _in: $inputFields }
          }
        ) {
          id
          fieldOptions
          displayRules
          type
          questionId
          Question {
            key
          }
        }
        formtype
        id
      }
    }
  }
  OPSToIQCuration(where: { id: { _in: $Id } }) {
    id
    formInvitationId
    status
    processingType: __typename
    FormInvitation {
      id
      metadata
      FormSubmissions(where: { isActive: { _eq: true } }) {
        Answers {
          formFieldId
          data
          FormField {
            id
            type
            field
            questionId
            fieldOptions
          }
        }
      }
      Form {
        FormFields(
          where: {
            questionId: { _is_null: false }
            type: { _in: $inputFields }
          }
        ) {
          id
          fieldOptions
          displayRules
          type
          questionId
          Question {
            key
          }
        }
        formtype
        id
      }
    }
  }
}
