query getLastInvitationAnswerDetailsForCompanyByUserId(
  $userIds: [uuid!]!
  $formId: uuid
  $parentcompanyId: uuid
  $status: [String!]!
) {
  User(where: { id: { _in: $userIds } }) {
    id
    Company {
      LastFormInvitationWithoutUserId: ParentCompanyMappings(
        where: {
          ParentCompanyId: { _eq: $parentcompanyId }
          FormInvitations: {
            _and: [
              { formId: { _eq: $formId } }
              { status: { _in: ["Submitted", "Approved"] } }
            ]
          }
        }
        order_by: { FormInvitations_aggregate: { max: { created_at: desc } } }
        limit: 1
      ) {
        id: CompanyId
        FormInvitations(
          where: {
            formId: { _eq: $formId }
            isActive: { _eq: true }
            status: { _in: ["Submitted", "Approved"] }
            parentcompanyId: { _eq: $parentcompanyId }
          }
          order_by: { created_at: desc }
          limit: 1
        ) {
          id
          companyId
          created_at
          FormSubmissions(where: { isActive: { _eq: true } }) {
            Interim_Answers_aggregate {
              aggregate {
                count
              }
            }
            Interim_Answers {
              isDeleted
              updated_by
              id
              formFieldId
              submissionId
              questionId
              data
              created_by
              Interim_Recommendations(where: { status: { _nin: $status } }) {
                interim_answer_id
                id
              }
              FormSubmission {
                invitationId
              }
              Interim_Answer {
                isDeleted
                submissionId
                Interim_Recommendations(where: { status: { _nin: $status } }) {
                  interim_answer_id
                  id
                }
              }
            }
          }
        }
      }
    }
  }
}
