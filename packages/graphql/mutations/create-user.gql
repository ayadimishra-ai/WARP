mutation createUser($input: [User_insert_input!]!) {
  insert_User(objects: $input, on_conflict: { constraint: User_email_key }) {
    affected_rows
    returning {
      id
      name
      email
      emailVerified
      phone
      phoneVerified
      image
      details
      companyId
      created_by
      updated_by
      UserRoles {
        roleName
        Role {
          id
          isActive
        }
      }
    }
  }
}
