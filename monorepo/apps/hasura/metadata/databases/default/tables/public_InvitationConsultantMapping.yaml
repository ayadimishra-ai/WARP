table:
  name: InvitationConsultantMapping
  schema: public
object_relationships:
  - name: AppUser
    using:
      foreign_key_constraint_on: consultantUserId
  - name: FormInvitation
    using:
      foreign_key_constraint_on: invitationId
  - name: Organization
    using:
      foreign_key_constraint_on: consultantCompanyId
  - name: appUserByCreatedBy
    using:
      foreign_key_constraint_on: created_by
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
