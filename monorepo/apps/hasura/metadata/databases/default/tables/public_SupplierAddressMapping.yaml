table:
  name: SupplierAddressMapping
  schema: public
object_relationships:
  - name: Address
    using:
      foreign_key_constraint_on: address_id
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: OrgSupplierMaster
    using:
      foreign_key_constraint_on: org_supplier_master_id
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
