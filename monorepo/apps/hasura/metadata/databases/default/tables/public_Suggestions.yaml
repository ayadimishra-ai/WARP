table:
  name: Suggestions
  schema: public
object_relationships:
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: FormField
    using:
      foreign_key_constraint_on: formFieldId
  - name: FormInvitation
    using:
      foreign_key_constraint_on: formInvitationId
  - name: appUserBySelectedbyuserid
    using:
      foreign_key_constraint_on: selectedByUserId
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
array_relationships:
  - name: SuggestionSourceMappings
    using:
      foreign_key_constraint_on:
        column: suggestionId
        table:
          name: SuggestionSourceMapping
          schema: public
