table:
  name: OrgBrandMaster
  schema: public
object_relationships:
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: Organization
    using:
      foreign_key_constraint_on: organization_id
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
array_relationships:
  - name: OrgProductMasters
    using:
      foreign_key_constraint_on:
        column: org_brand_master_id
        table:
          name: OrgProductMaster
          schema: public
