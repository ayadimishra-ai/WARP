table:
  name: Country
  schema: public
object_relationships:
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
array_relationships:
  - name: Addresses
    using:
      foreign_key_constraint_on:
        column: country_id
        table:
          name: Addresses
          schema: public
  - name: States
    using:
      foreign_key_constraint_on:
        column: country_id
        table:
          name: State
          schema: public
