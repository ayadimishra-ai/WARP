table:
  name: Interim_Comments
  schema: public
object_relationships:
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: FormInvitation
    using:
      foreign_key_constraint_on: invitationId
  - name: Interim_Recommendation
    using:
      foreign_key_constraint_on: interim_recommendation_id
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
