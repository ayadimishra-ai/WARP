table:
  name: SuggestedDocuments
  schema: public
object_relationships:
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: Form
    using:
      foreign_key_constraint_on: formId
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
array_relationships:
  - name: SourceFiles
    using:
      foreign_key_constraint_on:
        column: suggestedDocumentId
        table:
          name: SourceFiles
          schema: public
