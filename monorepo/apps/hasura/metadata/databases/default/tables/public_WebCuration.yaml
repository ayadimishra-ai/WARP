table:
  name: WebCuration
  schema: public
object_relationships:
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: FormInvitation
    using:
      foreign_key_constraint_on: formInvitationId
  - name: appUserByTriggeredbyuserid
    using:
      foreign_key_constraint_on: triggeredByUserId
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
