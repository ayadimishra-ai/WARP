table:
  name: EmailTemplate
  schema: public
object_relationships:
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: Form
    using:
      foreign_key_constraint_on: formId
  - name: Organization
    using:
      foreign_key_constraint_on: companyId
  - name: Platform
    using:
      foreign_key_constraint_on: platformId
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
