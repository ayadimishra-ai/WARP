table:
  name: SuggestionSourceMapping
  schema: public
object_relationships:
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: Source
    using:
      foreign_key_constraint_on: sourceId
  - name: Suggestion
    using:
      foreign_key_constraint_on: suggestionId
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
