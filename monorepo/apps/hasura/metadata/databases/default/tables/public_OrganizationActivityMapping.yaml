table:
  name: OrganizationActivityMapping
  schema: public
object_relationships:
  - name: Activity
    using:
      foreign_key_constraint_on: activity_id
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: Organization
    using:
      foreign_key_constraint_on: organization_id
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
