table:
  name: GHGEnergy_CaptivePower
  schema: public
object_relationships:
  - name: ActivityTaskRequest
    using:
      foreign_key_constraint_on: activity_task_request_id
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: OrganizationAddress
    using:
      foreign_key_constraint_on: organization_address_id
  - name: TaskRequest
    using:
      foreign_key_constraint_on: task_request_id
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
array_relationships:
  - name: GHGEnergy_CaptivePower_NonRenewables
    using:
      foreign_key_constraint_on:
        column: GHGEnergyConsumption_CaptivePower_id
        table:
          name: GHGEnergy_CaptivePower_NonRenewable
          schema: public
  - name: GHGEnergy_CaptivePower_Renewables
    using:
      foreign_key_constraint_on:
        column: GHGEnergyConsumption_CaptivePower_id
        table:
          name: GHGEnergy_CaptivePower_Renewable
          schema: public
