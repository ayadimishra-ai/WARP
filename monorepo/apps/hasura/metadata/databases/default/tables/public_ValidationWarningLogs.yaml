table:
  name: ValidationWarningLogs
  schema: public
object_relationships:
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: FormField
    using:
      foreign_key_constraint_on: formFieldId
  - name: FormInvitation
    using:
      foreign_key_constraint_on: InvitationId
  - name: Question
    using:
      foreign_key_constraint_on: QuestionId
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
