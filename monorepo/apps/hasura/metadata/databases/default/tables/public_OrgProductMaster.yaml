table:
  name: OrgProductMaster
  schema: public
object_relationships:
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: OrgBrandMaster
    using:
      foreign_key_constraint_on: org_brand_master_id
  - name: Organization
    using:
      foreign_key_constraint_on: organization_id
  - name: OrganizationAddress
    using:
      foreign_key_constraint_on: organization_address_id
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
array_relationships:
  - name: OrgSKUMasters
    using:
      foreign_key_constraint_on:
        column: org_product_master_id
        table:
          name: OrgSKUMaster
          schema: public
