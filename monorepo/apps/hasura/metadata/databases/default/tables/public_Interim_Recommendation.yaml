table:
  name: Interim_Recommendation
  schema: public
object_relationships:
  - name: AppUser
    using:
      foreign_key_constraint_on: created_by
  - name: Interim_Answer
    using:
      foreign_key_constraint_on: interim_answer_id
  - name: Question
    using:
      foreign_key_constraint_on: questionId
  - name: appUserByUpdatedBy
    using:
      foreign_key_constraint_on: updated_by
array_relationships:
  - name: Interim_Comments
    using:
      foreign_key_constraint_on:
        column: interim_recommendation_id
        table:
          name: Interim_Comments
          schema: public
