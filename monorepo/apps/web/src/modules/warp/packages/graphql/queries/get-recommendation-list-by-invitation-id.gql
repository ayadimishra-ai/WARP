query getRecommendationListByInvitationId(
  $invitationId: uuid
  $questionId: uuid!
) {
  FormInvitation(where: { id: { _eq: $invitationId } }) {
    id
    created_at
    status
    Form {
      id
      name
    }
    companyId
    Company {
      name
    }
    interimCheck
    FormSubmissions(where: { _and: [{ isActive: { _eq: true } }] }) {
      id
      addRecommendation: Interim_Answers(
        where: { questionId: { _eq: $questionId } }
        order_by: { created_at: desc }
      ) {
        id
        formFieldId
        isViewOnly
      }
      Interim_Answers(
        where: {
          _and: {
            Interim_Recommendations: { id: { _is_null: false } }
            questionId: { _eq: $questionId }
          }
        }
        order_by: { created_at: desc }
      ) {
        submissionId
        questionId
        id
        formFieldId
        isViewOnly
        Interim_Recommendations(order_by: { created_at: desc }) {
          created_at
          updated_at
          created_by
          updated_by
          status
          recommendations
          questionId
          Question {
            key
          }
          Interim_Answer {
            FormField {
              field
              created_at
            }
          }
          isActive
          id
          expectedDate
          answeroption
          ReminderIntervalAfterDueDate
          Interim_Comments(order_by: { created_at: asc }) {
            id
            comments
            upload_document
            updated_by
            updated_at
            interim_recommendation_id
            created_by
            created_at
            filename
            User {
              id
              name
            }
          }
        }
        Interim_Answer {
          Interim_Recommendations(order_by: { created_at: desc }) {
            updated_by
            updated_at
            status
            recommendations
            questionId
            Question {
              key
            }
            isActive
            interim_answer_id
            Interim_Answer {
              FormField {
                field
                created_at
              }
            }
            id
            expectedDate
            created_by
            created_at
            answeroption
            isApproved
            ReminderIntervalAfterDueDate
            Interim_Comments {
              upload_document
              updated_by
              updated_at
              interim_recommendation_id
              id
              filename
              created_by
              created_at
              comments
            }
          }
        }
      }
      carryforwardAfterSubmit: Interim_Answers(
        where: {
          _and: {
            Interim_Answer: { id: { _is_null: false } }
            questionId: { _eq: $questionId }
          }
        }
        order_by: { created_at: desc }
      ) {
        submissionId
        questionId
        id
        formFieldId
        isViewOnly
        Interim_Answer {
          Interim_Recommendations(order_by: { created_at: desc }) {
            updated_by
            updated_at
            status
            recommendations
            questionId
            Question {
              key
            }
            isActive
            interim_answer_id
            Interim_Answer {
              FormField {
                field
                created_at
              }
            }
            id
            expectedDate
            created_by
            created_at
            answeroption
            isApproved
            ReminderIntervalAfterDueDate
            Interim_Comments {
              upload_document
              updated_by
              updated_at
              interim_recommendation_id
              id
              filename
              created_by
              created_at
              comments
            }
          }
        }
      }
      Answers(where: { questionId: { _eq: $questionId } }) {
        id
        questionId
        formFieldId
        carryforwardbeforesubmit0: Interim_Answers(
          where: { Interim_Recommendations: { id: { _is_null: false } } }
        ) {
          Interim_Recommendations(order_by: { created_at: desc }) {
            created_at
            updated_at
            created_by
            updated_by
            status
            recommendations
            questionId
            Question {
              key
            }
            isActive
            id
            expectedDate
            answeroption
            ReminderIntervalAfterDueDate
            Interim_Comments(order_by: { created_at: asc }) {
              id
              comments
              upload_document
              updated_by
              updated_at
              interim_recommendation_id
              created_by
              created_at
              User {
                id
                name
              }
            }
          }
        }

        carryforwardbeforesubmit1: Interim_Answers(
          where: { Interim_Answer: { id: { _is_null: false } } }
        ) {
          Interim_Answer {
            Interim_Recommendations(order_by: { created_at: desc }) {
              created_at
              updated_at
              created_by
              updated_by
              status
              recommendations
              questionId
              Question {
                key
              }
              isActive
              id
              expectedDate
              answeroption
              ReminderIntervalAfterDueDate
              Interim_Comments(order_by: { created_at: asc }) {
                id
                comments
                upload_document
                updated_by
                updated_at
                interim_recommendation_id
                created_by
                created_at
                User {
                  id
                  name
                }
              }
            }
          }
        }
        carryforwardbeforesubmit2: Interim_Answers(
          where: { Interim_Answers: { id: { _is_null: false } } }
        ) {
          Interim_Answers {
            Interim_Recommendations(order_by: { created_at: desc }) {
              created_at
              updated_at
              created_by
              updated_by
              status
              recommendations
              questionId
              Question {
                key
              }
              isActive
              id
              expectedDate
              answeroption
              ReminderIntervalAfterDueDate
              Interim_Comments(order_by: { created_at: asc }) {
                id
                comments
                upload_document
                updated_by
                updated_at
                interim_recommendation_id
                created_by
                created_at
                User {
                  id
                  name
                }
              }
            }
          }
        }
      }
    }
  }
}
