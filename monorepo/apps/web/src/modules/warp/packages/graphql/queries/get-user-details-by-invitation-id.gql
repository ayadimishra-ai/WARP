query getUserDetailsByInvitationId($invitationId: uuid!) {
  FormInvitation(
    where: {
      _and: [{ id: { _eq: $invitationId } }, { isActive: { _eq: true } }]
    }
  ) {
    id
    email
    Company {
      id
      name
    }
    ParentCompanyMapping {
      User {
        id
        email
        name
      }
    }
  }
}
