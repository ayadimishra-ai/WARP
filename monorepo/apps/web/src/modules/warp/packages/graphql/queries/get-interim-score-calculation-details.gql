query getInterimScoreCalculationDetails(
  $invitationId: uuid!
  $submissionId: uuid!
  $formId: uuid!
) {
  FormInvitation(where: { id: { _eq: $invitationId } }) {
    companyId
    created_by
  }
  Form(where: { id: { _eq: $formId } }) {
    id
    calc
    Sections {
      id
      key
      calc
      ChildSections {
        id
        key
        calc
      }
      Questions {
        id
        key
        calc
        FormFields {
          id
          field
          interface
          recommendationCalc
        }
        Interim_Answers(where: { submissionId: { _eq: $submissionId } }) {
          id
          data
          status
          created_by
          updated_by
          FormField {
            id
            field
          }
        }
      }
      sectionId
    }
  }
  GlobalMaster(where: { type: { _eq: "OnFormScoreCalculationTrigger" } }) {
    id
    platformId
    data
    type
  }
  reopenlist_FormInvitation: FormInvitation(
    where: { _and: [{ id: { _eq: $invitationId } }] }
  ) {
    id
    formId
    status
    companyByParentcompanyid {
      id
    }
  }
}
