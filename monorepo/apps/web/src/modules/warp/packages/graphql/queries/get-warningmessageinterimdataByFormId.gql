query getWarninginterimdataByFormId($formId: uuid, $companyId: [uuid!]!) {
  FormInvitation(
    where: {
      formId: { _eq: $formId }
      companyId: { _in: $companyId }
      isActive: { _eq: true }
      status: { _eq: "Submitted" }
    }
    order_by: { created_at: asc }
  ) {
    id
    formId
    companyId
    email
    durationFrom
    durationTo
    isActive
    interimCheck
    FormSubmissions(where: { isActive: { _eq: true } }) {
      id
      Answers(where: { FormField: { warningRules: { _neq: "null" } } }) {
        formFieldId
        data
        FormField {
          warningRules
        }
      }
    }
  }
}
