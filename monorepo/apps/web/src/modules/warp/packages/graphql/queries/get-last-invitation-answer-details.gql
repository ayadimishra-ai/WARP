query getLastInvitationAnswerDetails(
  $companyId: [uuid!]!
  $formId: uuid
  $parentcompanyId: uuid
  $status: [String!]!
) {
  # FormInvitation(where: {formId: {_eq: $formId}, companyId: {_in: $companyId}, isActive: {_eq: true}, status: {_eq: "Submitted"}, parentcompanyId: {_eq: $parentcompanyId}}, order_by: {created_at: desc}) {
  #   id
  #   companyId
  #   created_at
  #   FormSubmissions(where: {isActive: {_eq: true}}) {
  #     Interim_Answers {
  #       updated_by
  #       id
  #       formFieldId
  #       submissionId
  #       questionId
  #       data
  #       created_by
  #       Interim_Recommendations(where: {status: {_nin: $status}}) {
  #         interim_answer_id
  #         id
  #       }
  #         FormSubmission{
  #           invitationId
  #         }
  #       Interim_Answer {
  #         submissionId
  #         Interim_Recommendations(where: {status: {_nin: $status}}) {
  #           interim_answer_id
  #           id
  #         }
  #       }
  #     }
  #   }
  # }
  LastFormInvitation: Company(where: { id: { _in: $companyId } }) {
    id
    FormInvitations(
      where: {
        formId: { _eq: $formId }
        isActive: { _eq: true }
        status: { _in: ["Submitted", "Approved"] }
        parentcompanyId: { _eq: $parentcompanyId }
      }
      order_by: { created_at: desc }
      limit: 1
    ) {
      id
      companyId
      created_at
      FormSubmissions(where: { isActive: { _eq: true } }) {
        Interim_Answers_aggregate {
          aggregate {
            count
          }
        }
        Interim_Answers {
          isDeleted
          updated_by
          id
          formFieldId
          submissionId
          questionId
          data
          created_by
          Interim_Recommendations(where: { status: { _nin: $status } }) {
            interim_answer_id
            id
          }
          FormSubmission {
            invitationId
          }
          Interim_Answer {
            isDeleted
            submissionId
            Interim_Recommendations(where: { status: { _nin: $status } }) {
              interim_answer_id
              id
            }
          }
        }
      }
    }
  }
}
