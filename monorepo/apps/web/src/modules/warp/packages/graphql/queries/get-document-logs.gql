query GetDocumentLogs($where: DocumentLogs_bool_exp!) {
  DocumentLogs(where: $where, order_by: { createdAt: desc }) {
    AISuggestedDocuments {
      title
      isOther
      id
      masterDocumentKey
    }
    id
    companyId
    originalFileName
    status
    aiSuggestedDocumentId
    updatedBy
    updatedAt
    fileSize
    fileName
    fileUrl
    createdBy
    expiryDate
    error
    deletedBy
    deletedAt
    cardName
    version
    createdAt
    raraResponse
    uploadedFromInvitationId
    extractionPercentage

    # join to User for updatedBy
    UserByCreatedBy {
      id
      name
    }
  }
}
