query getSuggestionsAndFormFieldDataByInvitationId(
  $invitationId: uuid
  $inputFields: [String!]!
) {
  FormInvitation(where: { id: { _eq: $invitationId } }) {
    FormSubmissions(where: { isActive: { _eq: true } }) {
      id
      Answers_aggregate {
        aggregate {
          count
        }
      }
    }
    id
    Suggestions(
      where: { selectedByUserId: { _is_null: true }, isSelected: { _eq: true } }
    ) {
      id
      selectedByUserId
      isSelected
      formFieldId
      suggestion
      FormField {
        id
        type
        field
        questionId
        fieldOptions
      }
    }
    Form {
      FormFields(
        where: { questionId: { _is_null: false }, type: { _in: $inputFields } }
      ) {
        id
        fieldOptions
        displayRules
        type
        questionId
        Question {
          key
        }
      }
    }
  }
}
