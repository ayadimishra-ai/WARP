query getInvitedAssessmentListByCompanyId($companyId: uuid!) {
  FormInvitation(
    where: {
      _and: { status: { _eq: "Invited" } }
      companyId: { _eq: $companyId }
    }
  ) {
    id
    formId
    companyId
    parentcompanyId
    email
    reviewerDetails
    reviewerParentCompanyId
    Form {
      id
      name
    }
  }
}
