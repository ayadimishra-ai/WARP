mutation deleteUserDetailById($id: uuid) {
  update_User(where: { id: { _eq: $id } }, _set: { isActive: false }) {
    affected_rows
    returning {
      id
      name
      email
      emailVerified
      phone
      phoneVerified
      image
      details
      companyId
      created_by
      updated_by
      isActive
    }
  }
}
