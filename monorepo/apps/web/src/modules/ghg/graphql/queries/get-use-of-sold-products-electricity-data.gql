query getUseOfSoldProductsElectricityData($task_request_id: [uuid!]) {
  GHGUseOfSoldProducts_Electricity(
    where: { task_request_id: { _in: $task_request_id } }
  ) {
    id
    task_request_id
    Date
    Product_Code
    Lifetime_of_Product
    Rationale
    Region
    Units_of_Electricity_consumed_in_kWh
    Additional_comments
    Remarks
    metadata
  }
}
