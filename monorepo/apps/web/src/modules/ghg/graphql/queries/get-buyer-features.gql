query GetBuyerFeatures($orgId: uuid!) {
  BuyerSupplierMappings(where: { buyerOrgid: { _eq: $orgId } }) {
    buyerOrgid
    supplierOrgid

    Organization {
      id
      name
      OrgSupplierMasters(
        where: { buyer_features: { _is_null: false } }
        limit: 1
      ) {
        id
        code
        name
        buyer_features
      }
    }
  }
}
