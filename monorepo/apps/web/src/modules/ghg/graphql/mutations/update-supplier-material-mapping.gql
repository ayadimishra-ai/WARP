mutation updateSupplierMaterialMapping(
  $id: uuid!
  $set: SupplierMaterialMapping_set_input!
) {
  update_SupplierMaterialMapping_by_pk(
    pk_columns: { id: $id }
    _set: $set
  ) {
    id
    organization_id
    supplier_address_mapping_id
    org_material_master_id
    From_Year
    From_Month
    To_Year
    To_Month
    updated_at
  }
}
