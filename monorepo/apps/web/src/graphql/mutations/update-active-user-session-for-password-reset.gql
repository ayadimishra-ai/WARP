mutation updateActiveUserSessionForPasswordReset($userId: uuid!, $statusMetadata: jsonb!) {
  update_Tbl_UserSessions(
    _set: {Status:"Inactive", StatusMetadata: $statusMetadata}
    where: {UserId: {_eq: $userId}, Status:{_eq:"Active"}}, 
  ) {
    affected_rows
    returning{
      id
    }
  }
}
