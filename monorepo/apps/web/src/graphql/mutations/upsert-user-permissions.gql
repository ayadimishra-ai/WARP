mutation upsertUserPermissions(
  $userguid: [uuid!]!
  $input: [Tbl_UserPermissions_insert_input!]!
) {
  delete_Tbl_UserPermissions(where: { UserGuid: { _in: $userguid } }) {
    returning {
      UserGuid
      PermissionGuid
    }
  }
  insert_Tbl_UserPermissions(objects: $input) {
    returning {
      UserPermissionGuid
      UserGuid
      PermissionGuid
      Rights
      Tbl_Permission {
        Tbl_Page {
          PageKey
          PlatformType
        }
      }
    }
  }
}
