version: "3.9"
name: snowkap-local
services:
  postgres:
    container_name: postgres
    image: postgres:17
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "4321:5432"
    environment:
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
  graphql-engine:
    container_name: hsaura-graphql-engine
    image: hasura/graphql-engine:v2.48.1
    ports:
      - "5001:8080"
    restart: always
    environment:
      ## postgres database to store Hasura metadata
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/postgres
      ## this env var can be used to add the above postgres database to Hasura as a data source. this can be removed/updated based on your needs
      PG_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/postgres
      ## enable the console served by server
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true" # set to "false" to disable console
      ## enable debugging mode. It is recommended to disable this in production
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      ## uncomment next line to run console offline (i.e load console assets from server instead of CDN)
      # HASURA_GRAPHQL_CONSOLE_ASSETS_DIR: /srv/console-assets
      ## uncomment next line to set an admin secret
      HASURA_GRAPHQL_ADMIN_SECRET: SPht+yuXxt76RsuH7YfMQ88uh0285DoIP7T6Blp1wFJvy9B9VUPOhm731uR6HvjT2bPoc69IsUWdur0cUWwzjg==
      # Hasura Auth Webhook
      HASURA_GRAPHQL_AUTH_HOOK: "http://host.docker.internal:3000/api/webhooks/hasura-auth"
      HASURA_GRAPHQL_AUTH_HOOK_MODE: "POST"
      HASURA_GRAPHQL_AUTH_HOOK_SEND_REQUEST_BODY: "true"
  valkey:
    container_name: valkey
    image: valkey/valkey:8.1.1
    hostname: valkey
    volumes:
      - ./conf/valkey.conf:/etc/valkey/valkey.conf
      - db_data:/data
    command: valkey-server /etc/valkey/valkey.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    restart: always
volumes:
  db_data:
